<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לידים</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
body { font-family: 'Heebo', sans-serif; background: #f1f5f9; margin: 0; color: #1e293b; }
.login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e3a8a, #3b82f6); }
.login-box { background: white; padding: 2rem; border-radius: 16px; width: 90%; max-width: 380px; }
.login-box h1 { text-align: center; color: #1e3a8a; margin: 0 0 1.5rem; }
.form-group { margin-bottom: 0.9rem; }
.form-group label { display: block; margin-bottom: 0.3rem; font-weight: 500; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.65rem; border: 1px solid #e2e8f0; border-radius: 8px; font-family: inherit; }
.btn { background: #1e3a8a; color: white; border: none; padding: 0.65rem 1.1rem; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 600; }
a.btn { display: inline-block; text-decoration: none; }
.btn:hover { background: #1e40af; }
.btn-wa { background: #25D366; }
.btn-outline { background: transparent; color: #1e3a8a; border: 1.5px solid #1e3a8a; }
.header { background: #1e3a8a; color: white; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
.container { max-width: 1400px; margin: 0 auto; padding: 1rem; }
.tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
.tab { padding: 0.6rem 1rem; background: white; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 600; }
.tab.active { background: #1e3a8a; color: white; }
.hidden { display: none !important; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.7rem; margin-bottom: 1rem; }
.stat-card { background: white; border-radius: 10px; padding: 0.9rem; text-align: center; }
.stat-card .num { font-size: 1.5rem; font-weight: 700; color: #1e3a8a; }
.toolbar { background: white; padding: 0.7rem; border-radius: 10px; margin-bottom: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
th, td { padding: 0.7rem; text-align: right; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem; }
th { background: #f8fafc; }
.status { padding: 0.2rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
.status.open { background: #dbeafe; color: #1d4ed8; }
.status.closed { background: #d1fae5; color: #065f46; }
.status.not-closed { background: #fee2e2; color: #991b1b; }
.status.cancelled { background: #f3e8ff; color: #6b21a8; }
.urgent { background: #fef2f2 !important; }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; }
.modal.active { display: flex; }
.modal-content { background: white; padding: 1.3rem; border-radius: 12px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
.report-card { background: white; border-radius: 10px; padding: 1rem; margin-bottom: 0.7rem; }
.cal-item { background: white; border-radius: 8px; padding: 0.8rem; margin-bottom: 0.5rem; border-right: 4px solid #1e3a8a; }
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <h1>לידים</h1>
    <div style="text-align:center; margin-bottom:1rem;">
      <img src="https://zohar-harashbi.co.il/wp-content/uploads/cropped-%D7%AA%D7%9E%D7%95%D7%A0%D7%94_%D7%A9%D7%9C_WhatsApp__2025-07-30_%D7%91%D7%A9%D7%A2%D7%94_10.04.33_da67cc47-removebg-preview.png" alt="לוגו" style="height:80px;">
    </div>
    <form id="loginForm" onsubmit="doLogin(event)">
      <div class="form-group"><label>שם משתמש</label><input type="text" id="loginUser" placeholder="שם משתמש" autocomplete="username"></div>
      <div class="form-group"><label>סיסמה</label><input type="password" id="loginPass" placeholder="סיסמה" autocomplete="current-password"></div>
      <button class="btn" style="width:100%;" type="submit">כניסה</button>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <div class="header">
    <div>
      <h1 style="margin:0; font-size:1.3rem;">לידים</h1>
      <small id="userInfo"></small>
    </div>
    <button class="btn" style="background:transparent; border:1px solid white;" type="button" onclick="doLogout()">יציאה</button>
  </div>
  <div class="container">
    <div class="tabs">
      <button type="button" class="tab active" data-tab="leads" onclick="switchTab('leads', event)">לידים</button>
      <button type="button" class="tab" data-tab="reports" onclick="switchTab('reports', event)">דוחות + ROI</button>
      <button type="button" class="tab" data-tab="calendar" onclick="switchTab('calendar', event)">לוח שנה</button>
      <button type="button" class="tab" data-tab="whatsapp" onclick="switchTab('whatsapp', event)">וואטסאפ</button>
      <button type="button" class="tab" data-tab="users" onclick="switchTab('users', event)">ניהול משתמשים</button>
    </div>

    <div id="panel-leads">
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <button class="btn" type="button" onclick="openLeadModal()">+ הוסף ליד חדש</button>
        <input type="text" id="search" placeholder="חיפוש..." oninput="renderLeads()" style="padding:0.5rem; border-radius:6px; border:1px solid #e2e8f0;">
        <select id="filterStatus" onchange="renderLeads()" style="padding:0.5rem; border-radius:6px; border:1px solid #e2e8f0;">
          <option value="">כל הסטטוסים</option>
          <option value="open">פתוח</option>
          <option value="closed">נסגר</option>
          <option value="not-closed">לא נסגר</option>
          <option value="cancelled">ביטל</option>
        </select>
        <select id="filterRabbanit" onchange="renderLeads()" style="padding:0.5rem; border-radius:6px; border:1px solid #e2e8f0;">
          <option value="">כל הרבניות</option>
        </select>
        <button class="btn" type="button" style="background:#0f766e;" onclick="openSheetsModal()">סנכרון גוגל שיטס</button>
        <button class="btn btn-outline" type="button" onclick="document.getElementById('csvFile').click()">ייבוא CSV</button>
        <input id="csvFile" class="hidden" type="file" accept=".csv,text/csv" onchange="importCSVFile(this)">
        <button class="btn btn-outline" type="button" onclick="exportCSV()">ייצוא</button>
      </div>
      <table>
        <thead>
          <tr><th>שם</th><th>טלפון</th><th>מקור</th><th id="costHeader">עלות</th><th>סטטוס</th><th>הוראות קבע</th><th>מזומן</th><th>סטטוס קבע</th><th>רבנית</th><th>תאריך חוג</th><th>פעולות</th></tr>
        </thead>
        <tbody id="leadsBody"></tbody>
      </table>
    </div>

    <div id="panel-reports" class="hidden">
      <h2>דוחות + ROI</h2>
      <div id="roiBox" class="report-card"></div>
      <div id="reportsContainer"></div>
      <button class="btn" type="button" style="margin-top:1rem;" onclick="generateWeeklyReport()">צור דוח שבועי</button>
      <div id="weeklyReport" style="margin-top:1rem; background:white; padding:1rem; border-radius:10px; white-space:pre-wrap;"></div>
    </div>

    <div id="panel-calendar" class="hidden">
      <h2>לוח שנה – חוגים קרובים</h2>
      <div id="calendarContainer"></div>
    </div>

    <div id="panel-whatsapp" class="hidden">
      <h2>תבניות וואטסאפ</h2>
      <div class="report-card">
        <select id="templateSelect" onchange="loadTemplate()" style="margin-bottom:0.5rem; padding:0.5rem; width:100%;">
          <option value="invite">הזמנה לחוג בית</option>
          <option value="reminder">תזכורת</option>
          <option value="thanks">תודה אחרי חוג</option>
        </select>
        <select id="waRabbanitFilter" style="margin-bottom:0.5rem; padding:0.5rem; width:100%;">
          <option value="">כל הרבניות / כל החוגים</option>
        </select>
        <textarea id="waTemplate" rows="6" style="width:100%;" oninput="clearWaQueue()"></textarea>
        <p style="font-size:0.85rem; color:#64748b;">משתנים: {name}, {rabbanit}, {date}</p>
        <button class="btn btn-wa" type="button" onclick="sendWAToOpen()">שלח לפי בחירה</button>
        <div id="waQueue" style="margin-top:0.8rem;"></div>
      </div>
    </div>

    <div id="panel-users" class="hidden">
      <h2>ניהול משתמשים</h2>
      <div class="toolbar"><button class="btn" type="button" onclick="openAddUser()">+ הוסף משתמש</button></div>
      <table>
        <thead><tr><th>שם משתמש</th><th>שם</th><th>שיוך</th><th>תפקיד</th><th>פעולות</th></tr></thead>
        <tbody id="usersList"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Lead Modal -->
<div class="modal" id="leadModal">
  <div class="modal-content">
    <h3 id="leadModalTitle">ליד חדש</h3>
    <form onsubmit="saveLead(event)">
      <input type="hidden" id="leadId">
      <div class="form-group"><label>שם</label><input id="leadName" required></div>
      <div class="form-group"><label>טלפון</label><input id="leadPhone" required></div>
      <div class="form-group"><label>אימייל</label><input id="leadEmail" type="email"></div>
      <div class="form-group"><label>מקור / קמפיין</label><input id="leadSource"></div>
      <div class="form-group"><label>עלות (₪)</label><input id="leadCost" type="number" value="0"></div>
      <div class="form-group"><label>סטטוס</label>
        <select id="leadStatus">
          <option value="open">פתוח</option>
          <option value="closed">נסגר חוג בית</option>
          <option value="not-closed">לא נסגר</option>
          <option value="cancelled">ביטל</option>
        </select>
      </div>
      <div class="form-group"><label>הוראות קבע (מספר)</label><input id="leadOrders" type="number" value="0"></div>
      <div class="form-group"><label>מזומן שהתקבל בערב (₪)</label><input id="leadCash" type="number" value="0"></div>
      <div class="form-group"><label>סטטוס הוראת קבע</label>
        <select id="leadOrderStatus">
          <option value="">לא רלוונטי</option>
          <option value="active">פעילה</option>
          <option value="inactive">לא פעילה</option>
          <option value="pending">ממתינה</option>
        </select>
      </div>
      <div class="form-group"><label>סכום חודשי מהוראת קבע (₪)</label><input id="leadMonthlyAmount" type="number" value="0"></div>
      <div class="form-group"><label>רבנית</label><input id="leadRabbanit"></div>
      <div class="form-group"><label>תאריך חוג בית</label><input id="leadEventDate" type="date"></div>
      <div class="form-group"><label>הערות</label><textarea id="leadNotes" rows="2"></textarea></div>
      <div id="historyBox" style="margin:0.5rem 0; max-height:100px; overflow-y:auto; font-size:0.8rem; color:#64748b;"></div>
      <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
        <button type="button" class="btn" style="background:#64748b;" onclick="closeLeadModal()">ביטול</button>
        <button type="submit" class="btn">שמירה</button>
      </div>
    </form>
  </div>
</div>

<!-- User Modal -->
<div class="modal" id="userModal">
  <div class="modal-content">
    <h3>הוספת רבנית</h3>
    <form onsubmit="saveNewUser(event)">
      <div class="form-group"><label>שם משתמש</label><input id="newUsername" autocomplete="off" required></div>
      <div class="form-group"><label>סיסמה</label><input id="newPassword" type="password" autocomplete="new-password"></div>
      <div class="form-group"><label>שם להצגה</label><input id="newDisplayName" required></div>
      <div class="form-group" id="newRabbanitGroup"><label>שם לשיוך (לרבנית)</label><input id="newRabbanit" placeholder="השאר ריק לפעיל"></div>
      <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
        <button type="button" class="btn" style="background:#64748b;" onclick="closeUserModal()">ביטול</button>
        <button type="submit" class="btn">שמירה</button>
      </div>
    </form>
  </div>
</div>

<!-- Sheets Modal -->
<div class="modal" id="sheetsModal">
  <div class="modal-content">
    <h3>סנכרון מגוגל שיטס</h3>
    <div class="form-group"><label>קישור הגיליון</label><input id="sheetsUrl"></div>
    <div style="display:flex; gap:0.5rem; justify-content:flex-end;">
      <button type="button" class="btn" style="background:#64748b;" onclick="document.getElementById('sheetsModal').classList.remove('active')">סגור</button>
      <button type="button" class="btn" onclick="syncSheets()">סנכרן</button>
    </div>
    <div id="syncStatus"></div>
  </div>
</div>

<script>
'use strict';
const TEMPLATES = {
  invite: `שלום {name},\nאנחנו מזוהר הרשבי שמחים להזמין אותך לחוג בית של הפרשת חלה אצל הרבנית {rabbanit}.\nנשמח לשמוע ממך!`,
  reminder: `שלום {name},\nתזכורת: החוג בית אצל הרבנית {rabbanit} מתקיים בקרוב.\nנשמח לראותך!`,
  thanks: `שלום {name},\nתודה שהשתתפת בחוג הבית של הרבנית {rabbanit}!\nנשמח אם תוכלי להמליץ לחברות נוספות.`
};

const STATUS_TEXT = { open:'פתוח', closed:'נסגר', 'not-closed':'לא נסגר', cancelled:'ביטל' };
const ORDER_TEXT = { active:'פעילה', inactive:'לא פעילה', pending:'ממתינה' };
const STATUS_FROM_TEXT = {
  open:'open', 'פתוח':'open', closed:'closed', 'נסגר':'closed', 'נסגר חוג בית':'closed',
  'not-closed':'not-closed', 'לא נסגר':'not-closed', cancelled:'cancelled', 'ביטל':'cancelled'
};
const ORDER_FROM_TEXT = {
  active:'active', 'פעילה':'active', inactive:'inactive', 'לא פעילה':'inactive',
  pending:'pending', 'ממתינה':'pending', '':'', 'לא רלוונטי':''
};
const FIELD_ALIASES = {
  name: ['שם', 'name', 'full name', 'fullname', 'full_name', 'שם מלא'],
  phone: ['טלפון', 'phone', 'phone number', 'phone_number', 'mobile', 'נייד', 'פלאפון'],
  email: ['אימייל', 'email', 'מייל', 'e-mail'],
  source: ['מקור', 'source', 'קמפיין', 'campaign'],
  cost: ['עלות', 'cost'],
  status: ['סטטוס', 'status'],
  standingOrders: ['הוראות קבע', 'standingorders', 'orders'],
  cash: ['מזומן', 'cash'],
  orderStatus: ['סטטוס קבע', 'orderstatus', 'סטטוס הוראת קבע'],
  monthlyAmount: ['סכום חודשי', 'monthly', 'monthlyamount'],
  rabbanit: ['רבנית', 'rabbanit'],
  eventDate: ['תאריך חוג', 'תאריך', 'date', 'eventdate'],
  notes: ['הערות', 'notes', 'note']
};
const KNOWN_HEADERS = new Set(Object.values(FIELD_ALIASES).flat().map(s => s.toLowerCase()));
const ADMIN_USERNAME = 'מנהל';

let leads = [];
let users = {};
let currentUser = null;
let idSeq = 0;

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw == null || raw === '') return structuredClone(fallback);
    const parsed = JSON.parse(raw);
    return parsed == null ? structuredClone(fallback) : parsed;
  } catch (err) {
    return structuredClone(fallback);
  }
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function asCount(value) {
  const n = Number(value);
  return Number.isFinite(n) ? String(n) : '0';
}

function asMoney(value) {
  const n = Number(value);
  return Number.isFinite(n) ? n.toFixed(0) : '0';
}

function newId() {
  idSeq += 1;
  return Date.now().toString(36) + idSeq.toString(36) + Math.random().toString(36).slice(2, 6);
}

function canonicalId(id) {
  if (typeof id === 'number' && Number.isFinite(id)) return String(id);
  if (typeof id === 'string' && id.trim()) return id.trim();
  return '';
}

function findLead(id) {
  const key = String(id);
  return leads.find(l => String(l.id) === key);
}

function saveLeads(silent) {
  try {
    localStorage.setItem('zohar_leads', JSON.stringify(leads));
  } catch (err) {
    if (!silent) alert('שמירת הנתונים נכשלה. ייתכן שהאחסון המקומי מלא.');
  }
}

function saveUsers() {
  try {
    localStorage.setItem('zohar_users', JSON.stringify(users));
    return true;
  } catch (err) {
    alert('שמירת המשתמשים נכשלה. ייתכן שהאחסון המקומי מלא.');
    return false;
  }
}

function normalizeLeadIds() {
  if (!Array.isArray(leads)) {
    leads = [];
    return;
  }
  const seen = new Set();
  let changed = false;
  const next = [];
  for (const item of leads) {
    if (!item || typeof item !== 'object') {
      changed = true;
      continue;
    }
    const copy = { ...item };
    let id = canonicalId(copy.id);
    if (!id || seen.has(id)) {
      id = newId();
      changed = true;
    }
    if (copy.id !== id) changed = true;
    copy.id = id;
    seen.add(id);
    if (copy.name != null && typeof copy.name !== 'string') copy.name = String(copy.name);
    next.push(copy);
  }
  leads = next;
  if (changed) saveLeads(true);
}

async function sha256(text) {
  if (!crypto.subtle) throw new Error('הדפדפן לא תומך בגיבוב מאובטח. פתחו את האתר דרך HTTPS.');
  const data = new TextEncoder().encode(String(text));
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function ensureUsers() {
  const loaded = loadJSON('zohar_users', {});
  users = loaded && typeof loaded === 'object' && !Array.isArray(loaded) ? loaded : {};
  let changed = false;
  for (const [key, user] of Object.entries(users)) {
    if (!user || typeof user !== 'object') {
      delete users[key];
      changed = true;
      continue;
    }
    if (typeof user.passHash === 'string' && user.passHash) {
      if (Object.prototype.hasOwnProperty.call(user, 'pass')) {
        delete user.pass;
        changed = true;
      }
    } else if (typeof user.pass === 'string') {
      user.passHash = await sha256(user.pass);
      delete user.pass;
      changed = true;
    }
  }
  if (users['מפעילה']) {
    delete users['מפעילה'];
    changed = true;
  }
  // סיסמאות ברירת המחדל נשמרות רק כגיבוב, ורק אם החשבון עדיין לא קיים.
  if (!users[ADMIN_USERNAME]) {
    users[ADMIN_USERNAME] = { passHash: await sha256('מנהל123'), name: 'מנהל', role: 'admin', rabbanit: '' };
    changed = true;
  } else if (!users[ADMIN_USERNAME].passHash) {
    users[ADMIN_USERNAME].passHash = await sha256('מנהל123');
    users[ADMIN_USERNAME].role = 'admin';
    changed = true;
  }
  if (!users['פעיל']) {
    users['פעיל'] = { passHash: await sha256('פעיל123'), name: 'פעיל', role: 'operator', rabbanit: '' };
    changed = true;
  } else if (!users['פעיל'].passHash && !Object.prototype.hasOwnProperty.call(users['פעיל'], 'pass')) {
    users['פעיל'].passHash = await sha256('פעיל123');
    changed = true;
  }
  if (changed) saveUsers();
}

function isAdmin() {
  return currentUser && currentUser.role === 'admin';
}

function isProtectedUsername(name) {
  const trimmed = String(name || '').trim();
  return trimmed === ADMIN_USERNAME || trimmed.toLowerCase() === 'admin';
}

function scopedLeads() {
  if (currentUser && currentUser.role === 'rabbanit' && currentUser.rabbanit) {
    return leads.filter(l => l.rabbanit === currentUser.rabbanit);
  }
  return leads;
}

function roleLabel(role) {
  if (role === 'admin') return 'מנהל';
  if (role === 'operator') return 'פעיל';
  return 'רבנית';
}

async function doLogin(e) {
  if (e && e.preventDefault) e.preventDefault();
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  try {
    await appReady;
    const hash = await sha256(p);
    if (!(users[u] && users[u].passHash && users[u].passHash === hash)) {
      alert('שם משתמש או סיסמה שגויים');
      return;
    }
    currentUser = { ...users[u], username: u };
    delete currentUser.pass;
    document.getElementById('loginPass').value = '';
    closeAllModals();
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    document.getElementById('userInfo').textContent = 'שלום ' + (currentUser.name || '') + ' (' + roleLabel(currentUser.role) + ')';
    const reportsTab = document.querySelector('.tab[data-tab="reports"]');
    if (reportsTab) reportsTab.style.display = isAdmin() ? '' : 'none';
    const usersTab = document.querySelector('.tab[data-tab="users"]');
    if (usersTab) usersTab.style.display = isAdmin() ? '' : 'none';
    switchTab('leads');
    renderLeads();
    if (isAdmin()) renderUsers();
    loadTemplate();
  } catch (err) {
    alert('לא ניתן לבדוק את הסיסמה בדפדפן זה');
  }
}

function closeAllModals() {
  document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
}

function doLogout() {
  currentUser = null;
  const pass = document.getElementById('loginPass');
  if (pass) pass.value = '';
  closeAllModals();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  switchTab('leads');
}

function switchTab(name, ev) {
  document.querySelectorAll('.tab').forEach(t => {
    if (t && t.classList) t.classList.remove('active');
  });
  let trigger = null;
  if (ev && ev.currentTarget && ev.currentTarget.classList && ev.currentTarget.classList.contains('tab')) {
    trigger = ev.currentTarget;
  }
  if (!trigger && ev && ev.target) {
    const el = ev.target.nodeType === 1 ? ev.target : ev.target.parentElement;
    if (el && el.closest) trigger = el.closest('.tab');
  }
  if (!trigger) trigger = document.querySelector('.tab[data-tab="' + name + '"]');
  if (trigger && trigger.classList) trigger.classList.add('active');
  ['leads', 'reports', 'calendar', 'whatsapp', 'users'].forEach(p => {
    const el = document.getElementById('panel-' + p);
    if (el) el.classList.toggle('hidden', p !== name);
  });
  if (name === 'reports') renderReports();
  if (name === 'calendar') renderCalendar();
  if (name === 'users' && isAdmin()) renderUsers();
  if (name === 'whatsapp') fillWaFilter();
}

function formatDate(value) {
  if (!value) return '-';
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return escapeHtml(value);
  return escapeHtml(d.toLocaleDateString('he-IL'));
}

function updateStats() {
  const data = scopedLeads();
  const total = data.length;
  const closed = data.filter(l => l.status === 'closed').length;
  const activeOrders = data.filter(l => l.orderStatus === 'active').length;
  let html = `
    <div class="stat-card"><div class="num">${total}</div><div>לידים</div></div>
    <div class="stat-card"><div class="num">${closed}</div><div>חוגים שנסגרו</div></div>
    <div class="stat-card"><div class="num">${activeOrders}</div><div>הוראות קבע פעילות</div></div>
  `;
  if (isAdmin()) {
    const monthlyIncome = data.filter(l => l.orderStatus === 'active').reduce((s, l) => s + (Number(l.monthlyAmount) || 0), 0);
    const totalCost = data.reduce((s, l) => s + (Number(l.cost) || 0), 0);
    html += `
      <div class="stat-card"><div class="num">₪${monthlyIncome.toFixed(0)}</div><div>הכנסה חודשית</div></div>
      <div class="stat-card"><div class="num">₪${totalCost.toFixed(0)}</div><div>עלות פרסום</div></div>
    `;
  }
  document.getElementById('stats').innerHTML = html;
}

function fillSelect(select, names, placeholder, current) {
  if (!select) return;
  select.innerHTML = `<option value="">${placeholder}</option>` + names.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
  if ([...select.options].some(o => o.value === current)) select.value = current;
}

function updateRabbanitFilter() {
  const select = document.getElementById('filterRabbanit');
  if (!select) return;
  const names = [...new Set(scopedLeads().map(l => l.rabbanit).filter(Boolean))];
  fillSelect(select, names, 'כל הרבניות', select.value);
}

function fillWaFilter() {
  const select = document.getElementById('waRabbanitFilter');
  if (!select) return;
  const names = [...new Set(scopedLeads().map(l => l.rabbanit).filter(Boolean))];
  fillSelect(select, names, 'כל הרבניות / כל החוגים', select.value);
}

function actionButton(action, id, label, className, style) {
  return `<button type="button" class="${className}" style="padding:0.3rem 0.5rem;font-size:0.8rem;${style || ''}" data-action="${action}" data-id="${escapeHtml(id)}">${label}</button>`;
}

function renderLeads() {
  const search = (document.getElementById('search')?.value || '').toLowerCase();
  const st = document.getElementById('filterStatus')?.value || '';
  const rab = document.getElementById('filterRabbanit')?.value || '';
  const filtered = scopedLeads().filter(l => {
    const name = String(l.name || '');
    const phone = String(l.phone || '');
    const okS = !search || name.toLowerCase().includes(search) || phone.includes(search);
    const okSt = !st || l.status === st;
    const okR = !rab || l.rabbanit === rab;
    return okS && okSt && okR;
  });
  const now = Date.now();
  const colCount = isAdmin() ? 11 : 10;
  document.getElementById('leadsBody').innerHTML = filtered.map(l => {
    const created = new Date(l.createdAt).getTime();
    const daysOpen = l.status === 'open' && Number.isFinite(created) ? Math.floor((now - created) / (24 * 60 * 60 * 1000)) : 0;
    const urgentClass = daysOpen > 3 ? 'urgent' : '';
    const knownStatus = !!l.status && Object.prototype.hasOwnProperty.call(STATUS_TEXT, l.status);
    const statusClass = knownStatus ? l.status : '';
    const statusLabel = knownStatus ? STATUS_TEXT[l.status] : escapeHtml(l.status || '');
    const orderLabel = l.orderStatus && Object.prototype.hasOwnProperty.call(ORDER_TEXT, l.orderStatus) ? ORDER_TEXT[l.orderStatus] : '-';
    const costCell = isAdmin() ? `<td>₪${asMoney(l.cost)}</td>` : '';
    const actions = [
      actionButton('edit', l.id, 'עריכה', 'btn', ''),
      actionButton('copy', l.id, 'העתק', 'btn', 'background:#64748b;'),
      actionButton('note', l.id, 'הערה', 'btn', 'background:#f59e0b;'),
      actionButton('wa', l.id, 'וואטסאפ', 'btn btn-wa', ''),
      actionButton('delete', l.id, 'מחיקה', 'btn', 'background:#dc2626;')
    ].join(' ');
    return `
    <tr class="${urgentClass}">
      <td><strong>${escapeHtml(l.name || '')}</strong>${daysOpen > 3 ? ' <span style="color:#dc2626;font-size:0.7rem;">(' + daysOpen + ' ימים)</span>' : ''}</td>
      <td>${escapeHtml(l.phone || '')}</td>
      <td>${escapeHtml(l.source || '')}</td>
      ${costCell}
      <td><span class="status ${statusClass}">${statusLabel}</span></td>
      <td>${asCount(l.standingOrders)}</td>
      <td>₪${asMoney(l.cash)}</td>
      <td>${orderLabel}</td>
      <td>${escapeHtml(l.rabbanit || '-')}</td>
      <td>${formatDate(l.eventDate)}</td>
      <td>${actions}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="${colCount}" style="text-align:center;padding:2rem;">אין לידים</td></tr>`;
  updateStats();
  updateRabbanitFilter();
  fillWaFilter();
  const costHeader = document.getElementById('costHeader');
  if (costHeader) costHeader.style.display = isAdmin() ? '' : 'none';
}

function onLeadAction(e) {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const id = btn.getAttribute('data-id');
  const action = btn.getAttribute('data-action');
  if (action === 'edit') editLead(id);
  else if (action === 'copy') copyLead(id);
  else if (action === 'note') quickNote(id);
  else if (action === 'wa') sendWA(id);
  else if (action === 'delete') deleteLead(id);
}

function renderCalendar() {
  const today = new Date().setHours(0, 0, 0, 0);
  const upcoming = scopedLeads()
    .filter(l => l.eventDate && new Date(l.eventDate) >= today)
    .sort((a, b) => new Date(a.eventDate) - new Date(b.eventDate));
  document.getElementById('calendarContainer').innerHTML = upcoming.length
    ? upcoming.map(l => `<div class="cal-item"><strong>${formatDate(l.eventDate)}</strong> – ${escapeHtml(l.name || '')} (${escapeHtml(l.rabbanit || 'ללא רבנית')})<br><small>${escapeHtml(l.phone || '')}</small></div>`).join('')
    : '<p>אין חוגים קרובים מתוכננים</p>';
}

function copyLead(id) {
  const l = findLead(id);
  if (!l) return;
  const text = `${l.name || ''}\n${l.phone || ''}`;
  const done = () => alert('הועתק!');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(done);
  } else done();
}

function quickNote(id) {
  const l = findLead(id);
  if (!l) return;
  const note = prompt('הערה מהירה:', l.notes || '');
  if (note === null) return;
  l.notes = note;
  if (!Array.isArray(l.history)) l.history = [];
  l.history.push({ date: new Date().toLocaleString('he-IL'), user: currentUser?.name || 'מערכת', change: 'הערה עודכנה' });
  saveLeads();
  renderLeads();
}

function deleteLead(id) {
  const l = findLead(id);
  if (!l) return alert('הליד לא נמצא');
  if (!confirm('למחוק את הליד של ' + (l.name || '') + '?')) return;
  leads = leads.filter(x => String(x.id) !== String(l.id));
  saveLeads();
  renderLeads();
}

function renderReports() {
  const data = scopedLeads();
  const totalAdCost = data.reduce((s, l) => s + (Number(l.cost) || 0), 0);
  const totalEventCost = data.reduce((s, l) => s + (Number(l.eventCost) || 0), 0);
  const totalCost = totalAdCost + totalEventCost;
  const oneTimeIncome = data.reduce((s, l) => s + (Number(l.oneTime) || 0), 0);
  let standingIncome = 0;
  data.filter(l => l.orderStatus === 'active' && l.orderStart).forEach(l => {
    const start = new Date(l.orderStart);
    const months = Math.max(1, Math.round((new Date() - start) / (30 * 24 * 60 * 60 * 1000)));
    standingIncome += (Number(l.monthlyAmount) || 0) * (Number.isFinite(months) ? months : 1);
  });
  data.filter(l => l.orderStatus === 'active' && !l.orderStart).forEach(l => {
    standingIncome += (Number(l.monthlyAmount) || 0);
  });
  const totalIncome = standingIncome + oneTimeIncome;
  const net = totalIncome - totalCost;
  const roi = totalCost > 0 ? (net / totalCost * 100).toFixed(0) : 0;
  document.getElementById('roiBox').innerHTML = `
    <h3>דוח ROI מדויק</h3>
    <p>עלות פרסום: <strong>₪${totalAdCost.toFixed(0)}</strong></p>
    <p>עלות קיום חוגים: <strong>₪${totalEventCost.toFixed(0)}</strong></p>
    <p>סה"כ עלויות: <strong>₪${totalCost.toFixed(0)}</strong></p>
    <hr>
    <p>הכנסה מהוראות קבע (עד היום): <strong>₪${standingIncome.toFixed(0)}</strong></p>
    <p>תרומות חד-פעמיות: <strong>₪${oneTimeIncome.toFixed(0)}</strong></p>
    <p>סה"כ הכנסות: <strong>₪${totalIncome.toFixed(0)}</strong></p>
    <hr>
    <p>רווח נקי: <strong>₪${net.toFixed(0)}</strong></p>
    <p>ROI: <strong>${roi}%</strong></p>
  `;
  const by = {};
  data.forEach(l => {
    const r = l.rabbanit || 'ללא שיוך';
    if (!by[r]) by[r] = { leads: 0, closed: 0, active: 0, income: 0 };
    by[r].leads++;
    if (l.status === 'closed') by[r].closed++;
    if (l.orderStatus === 'active') {
      by[r].active++;
      by[r].income += (Number(l.monthlyAmount) || 0);
    }
  });
  let html = '';
  for (const [name, d] of Object.entries(by)) {
    html += `<div class="report-card"><h3>${escapeHtml(name)}</h3><p>לידים: ${d.leads} | חוגים: ${d.closed} | הוראות קבע פעילות: ${d.active} | הכנסה חודשית: ₪${d.income.toFixed(0)}</p></div>`;
  }
  const bySource = {};
  data.forEach(l => {
    const s = l.source || 'אחר';
    if (!bySource[s]) bySource[s] = { total: 0, closed: 0 };
    bySource[s].total++;
    if (l.status === 'closed') bySource[s].closed++;
  });
  html += '<h3 style="margin-top:1.5rem;">דוח לפי מקור</h3>';
  for (const [name, d] of Object.entries(bySource)) {
    const rate = d.total ? Math.round(d.closed / d.total * 100) : 0;
    html += `<div class="report-card"><strong>${escapeHtml(name)}</strong>: ${d.total} לידים | ${d.closed} חוגים | המרה: ${rate}%</div>`;
  }
  const closedLeads = data.filter(l => l.status === 'closed');
  const avgOrders = closedLeads.length ? (closedLeads.reduce((s, l) => s + (Number(l.standingOrders) || 0), 0) / closedLeads.length).toFixed(1) : 0;
  html += `<div class="report-card" style="margin-top:1rem;"><strong>ממוצע הוראות קבע לחוג שנסגר:</strong> ${avgOrders}</div>`;
  document.getElementById('reportsContainer').innerHTML = html || '<p>אין נתונים</p>';
}

function generateWeeklyReport() {
  const data = scopedLeads();
  const text = `דוח שבועי זוהר CRM\nתאריך: ${new Date().toLocaleDateString('he-IL')}\nסה"כ לידים: ${data.length}\nחוגים שנסגרו: ${data.filter(l => l.status === 'closed').length}\nהוראות קבע פעילות: ${data.filter(l => l.orderStatus === 'active').length}`;
  document.getElementById('weeklyReport').textContent = text;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => alert('הועתק ללוח!')).catch(() => {});
  }
}

function setGroupVisible(id, visible) {
  const el = document.getElementById(id);
  if (!el) return;
  const group = el.closest('.form-group');
  if (group) group.style.display = visible ? '' : 'none';
}

function openLeadModal(id) {
  document.getElementById('leadModal').classList.add('active');
  ['leadCost', 'leadMonthlyAmount'].forEach(fid => setGroupVisible(fid, isAdmin()));
  const historyBox = document.getElementById('historyBox');
  if (id) {
    const l = findLead(id);
    if (!l) {
      alert('הליד לא נמצא');
      closeLeadModal();
      return;
    }
    document.getElementById('leadId').value = l.id;
    document.getElementById('leadName').value = l.name || '';
    document.getElementById('leadPhone').value = l.phone || '';
    document.getElementById('leadEmail').value = l.email || '';
    document.getElementById('leadSource').value = l.source || '';
    document.getElementById('leadCost').value = l.cost || 0;
    document.getElementById('leadStatus').value = STATUS_TEXT[l.status] ? l.status : 'open';
    document.getElementById('leadOrders').value = l.standingOrders || 0;
    document.getElementById('leadCash').value = l.cash || 0;
    document.getElementById('leadOrderStatus').value = ORDER_TEXT[l.orderStatus] ? l.orderStatus : '';
    document.getElementById('leadMonthlyAmount').value = l.monthlyAmount || 0;
    document.getElementById('leadRabbanit').value = l.rabbanit || '';
    document.getElementById('leadEventDate').value = l.eventDate || '';
    document.getElementById('leadNotes').value = l.notes || '';
    document.getElementById('leadModalTitle').textContent = 'עריכת ליד';
    historyBox.innerHTML = (Array.isArray(l.history) ? l.history : []).map(h => {
      if (!h || typeof h !== 'object') return '';
      return `<div>${escapeHtml(h.date)} – ${escapeHtml(h.user)}: ${escapeHtml(h.change)}</div>`;
    }).join('') || 'אין היסטוריה';
  } else {
    document.querySelector('#leadModal form').reset();
    document.getElementById('leadId').value = '';
    document.getElementById('leadModalTitle').textContent = 'ליד חדש';
    historyBox.textContent = '';
  }
}

function closeLeadModal() {
  document.getElementById('leadModal').classList.remove('active');
}

function applyField(obj, key, id, parser) {
  const el = document.getElementById(id);
  if (!el) return;
  obj[key] = parser ? parser(el.value) : el.value;
}

function saveLead(e) {
  e.preventDefault();
  const id = document.getElementById('leadId').value;
  const old = id ? findLead(id) : null;
  const lead = old ? { ...old, history: [...(Array.isArray(old.history) ? old.history : [])] } : {
    id: newId(),
    createdAt: new Date().toISOString(),
    history: [],
    orderStart: '',
    oneTime: 0,
    eventCost: 0
  };
  lead.id = String(lead.id);
  applyField(lead, 'name', 'leadName');
  applyField(lead, 'phone', 'leadPhone');
  applyField(lead, 'email', 'leadEmail');
  applyField(lead, 'source', 'leadSource');
  applyField(lead, 'cost', 'leadCost', v => +v || 0);
  applyField(lead, 'status', 'leadStatus');
  applyField(lead, 'standingOrders', 'leadOrders', v => +v || 0);
  applyField(lead, 'cash', 'leadCash', v => +v || 0);
  applyField(lead, 'orderStatus', 'leadOrderStatus');
  applyField(lead, 'monthlyAmount', 'leadMonthlyAmount', v => +v || 0);
  applyField(lead, 'orderStart', 'leadOrderStart');
  applyField(lead, 'oneTime', 'leadOneTime', v => +v || 0);
  applyField(lead, 'eventCost', 'leadEventCost', v => +v || 0);
  applyField(lead, 'rabbanit', 'leadRabbanit');
  applyField(lead, 'eventDate', 'leadEventDate');
  applyField(lead, 'notes', 'leadNotes');
  if (!lead.createdAt) lead.createdAt = new Date().toISOString();
  if (old && old.status !== lead.status) {
    lead.history.push({ date: new Date().toLocaleString('he-IL'), user: currentUser?.name || 'מערכת', change: `סטטוס: ${old.status} → ${lead.status}` });
  }
  if (old) {
    const i = leads.findIndex(l => String(l.id) === String(old.id));
    if (i >= 0) leads[i] = lead;
    else leads.unshift(lead);
  } else {
    leads.unshift(lead);
  }
  saveLeads();
  renderLeads();
  closeLeadModal();
}

function editLead(id) { openLeadModal(id); }

function loadTemplate() {
  const key = document.getElementById('templateSelect')?.value || 'invite';
  const ta = document.getElementById('waTemplate');
  if (ta) ta.value = TEMPLATES[key] || '';
  clearWaQueue();
}

function clearWaQueue() {
  const box = document.getElementById('waQueue');
  if (box) box.innerHTML = '';
}

function fillTemplate(tpl, lead) {
  const map = {
    '{name}': lead.name || '',
    '{rabbanit}': lead.rabbanit || '',
    '{date}': lead.eventDate || ''
  };
  return String(tpl || '').replace(/\{name\}|\{rabbanit\}|\{date\}/g, token => map[token] ?? '');
}

function waPhone(phone) {
  let d = String(phone || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('0')) d = '972' + d.slice(1);
  return d;
}

function waUrl(lead, template) {
  const msg = fillTemplate(template, lead);
  return 'https://wa.me/' + waPhone(lead.phone) + '?text=' + encodeURIComponent(msg);
}

function openExternal(url) {
  const a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function sendWA(id) {
  const l = findLead(id);
  if (!l) return alert('הליד לא נמצא');
  if (!waPhone(l.phone)) return alert('אין מספר טלפון לליד');
  const tpl = document.getElementById('waTemplate')?.value || TEMPLATES.invite;
  openExternal(waUrl(l, tpl));
}

function sendWAToOpen() {
  const rabbanitFilter = document.getElementById('waRabbanitFilter')?.value || '';
  let targets = scopedLeads().filter(l => l.status === 'open' && waPhone(l.phone));
  if (rabbanitFilter) targets = targets.filter(l => l.rabbanit === rabbanitFilter);
  if (!targets.length) return alert('אין לידים מתאימים');
  if (!confirm('להכין שליחת וואטסאפ ל-' + targets.length + ' לידים?')) return;
  const tpl = document.getElementById('waTemplate')?.value || TEMPLATES.invite;
  const box = document.getElementById('waQueue');
  if (!box) return;
  const links = targets.map(l => {
    const url = waUrl(l, tpl);
    return `<div style="margin:0.4rem 0;"><a class="btn btn-wa" target="_blank" rel="noopener noreferrer" href="${escapeHtml(url)}">וואטסאפ אל ${escapeHtml(l.name || '')}${l.phone ? ' · ' + escapeHtml(l.phone) : ''}</a></div>`;
  }).join('');
  box.innerHTML = `<p style="font-size:0.9rem;">נמצאו ${targets.length} לידים פתוחים. כל קישור נפתח בלחיצה נפרדת, כדי שהדפדפן לא יחסום חלונות.</p>` + links;
}

function csvCell(value) {
  const s = value == null ? '' : String(value);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function buildCSV(data) {
  const headers = ['שם', 'טלפון', 'אימייל', 'מקור', 'עלות', 'סטטוס', 'הוראות קבע', 'מזומן', 'סטטוס קבע', 'סכום חודשי', 'רבנית', 'תאריך חוג', 'הערות'];
  const rows = [headers];
  data.forEach(l => rows.push([
    l.name, l.phone, l.email, l.source, l.cost, l.status, l.standingOrders, l.cash, l.orderStatus, l.monthlyAmount, l.rabbanit, l.eventDate || '', l.notes || ''
  ]));
  return '\uFEFF' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}

function exportCSV() {
  const csv = buildCSV(scopedLeads());
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'zohar-leads.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function parseDelimited(text, delimiter) {
  const input = String(text || '').replace(/^\uFEFF/, '');
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < input.length; i++) {
    const c = input[i];
    if (inQuotes) {
      if (c === '"') {
        if (input[i + 1] === '"') {
          field += '"';
          i++;
        } else {
          inQuotes = false;
        }
      } else {
        field += c;
      }
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === delimiter) {
      row.push(field);
      field = '';
    } else if (c === '\n' || c === '\r') {
      if (c === '\r' && input[i + 1] === '\n') i++;
      row.push(field);
      rows.push(row);
      row = [];
      field = '';
    } else {
      field += c;
    }
  }
  if (field.length || row.length) {
    row.push(field);
    rows.push(row);
  }
  return rows.filter(r => r.some(cell => String(cell).trim() !== ''));
}

function parseCSV(text) {
  const sample = String(text || '').replace(/^\uFEFF/, '').split(/\r?\n/).slice(0, 5).join('\n');
  const commas = (sample.match(/,/g) || []).length;
  const semis = (sample.match(/;/g) || []).length;
  return parseDelimited(text, semis > commas && commas === 0 ? ';' : ',');
}

function looksLikeHeader(row) {
  return row.some(cell => KNOWN_HEADERS.has(String(cell).trim().toLowerCase()));
}

function headerIndex(headers, field) {
  const aliases = FIELD_ALIASES[field] || [];
  const norm = headers.map(h => String(h).trim().toLowerCase());
  for (const alias of aliases) {
    const i = norm.indexOf(alias.toLowerCase());
    if (i >= 0) return i;
  }
  return -1;
}

function valueAt(cols, idx) {
  if (typeof idx !== 'number' || idx < 0 || idx >= cols.length) return '';
  return cols[idx] == null ? '' : String(cols[idx]).trim();
}

function phoneKey(phone) {
  let d = String(phone || '').replace(/\D/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('972')) d = d.slice(3);
  d = d.replace(/^0+/, '');
  return d.length >= 7 ? d : '';
}

function inferRabbanit(campaign) {
  const c = String(campaign || '');
  if (c.includes('שרה')) return 'שרה';
  if (c.includes('רבקה')) return 'רבקה';
  if (c.includes('לאה')) return 'לאה';
  return '';
}

function mapChoice(raw, table) {
  const key = String(raw || '').trim();
  if (Object.prototype.hasOwnProperty.call(table, key)) return table[key];
  const lower = key.toLowerCase();
  if (Object.prototype.hasOwnProperty.call(table, lower)) return table[lower];
  return '';
}

function describeImport(added, skipped) {
  if (!added && !skipped) return 'לא נמצאו לידים לייבוא';
  let msg = 'נוספו ' + added + ' לידים';
  if (skipped) msg += ' · דולגו ' + skipped + ' כפולים (לפי טלפון)';
  return msg;
}

function importLeadRows(rows, opts) {
  const options = opts || {};
  if (!Array.isArray(rows) || !rows.length) return { added: 0, skipped: 0 };
  let dataRows = rows;
  let header = null;
  if (looksLikeHeader(rows[0])) {
    header = rows[0].map(c => String(c).trim());
    dataRows = rows.slice(1);
  } else if (rows.length > 1 && !rows[0].some(c => /\d/.test(String(c))) && rows[1].some(c => /\d/.test(String(c)))) {
    dataRows = rows.slice(1);
  }
  const idx = {};
  Object.keys(FIELD_ALIASES).forEach(field => {
    idx[field] = header ? headerIndex(header, field) : -1;
  });
  if (!header) {
    idx.name = 0;
    idx.phone = 1;
    idx.email = 2;
    idx.source = 3;
  }
  let added = 0;
  let skipped = 0;
  const batchPhones = new Set();
  dataRows.forEach(cols => {
    const name = valueAt(cols, idx.name);
    const phone = valueAt(cols, idx.phone);
    if (!name && !phone) return;
    const key = phoneKey(phone);
    if (key && (batchPhones.has(key) || leads.some(l => phoneKey(l.phone) === key))) {
      skipped++;
      return;
    }
    if (key) batchPhones.add(key);
    const source = valueAt(cols, idx.source) || (options.source === 'sheets' && !header ? 'Facebook' : '');
    let rabbanit = valueAt(cols, idx.rabbanit);
    if (!rabbanit) rabbanit = inferRabbanit(source);
    const status = mapChoice(valueAt(cols, idx.status), STATUS_FROM_TEXT) || 'open';
    const orderStatus = mapChoice(valueAt(cols, idx.orderStatus), ORDER_FROM_TEXT);
    leads.unshift({
      id: newId(),
      name: name || 'ללא שם',
      phone,
      email: valueAt(cols, idx.email),
      source,
      cost: +valueAt(cols, idx.cost) || 0,
      status: STATUS_TEXT[status] ? status : 'open',
      standingOrders: +valueAt(cols, idx.standingOrders) || 0,
      cash: +valueAt(cols, idx.cash) || 0,
      orderStatus: ORDER_TEXT[orderStatus] ? orderStatus : '',
      monthlyAmount: +valueAt(cols, idx.monthlyAmount) || 0,
      rabbanit,
      eventDate: valueAt(cols, idx.eventDate),
      notes: valueAt(cols, idx.notes) || (options.source === 'sheets' ? 'יובא' : ''),
      createdAt: new Date().toISOString(),
      history: [{
        date: new Date().toLocaleString('he-IL'),
        user: currentUser?.name || 'מערכת',
        change: options.source === 'sheets' ? 'יובא מגוגל שיטס' : 'יובא מקובץ CSV'
      }]
    });
    added++;
  });
  if (added) saveLeads();
  return { added, skipped };
}

function importCSVFile(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const rows = parseCSV(String(reader.result || ''));
      const result = importLeadRows(rows, { source: 'file' });
      renderLeads();
      alert(describeImport(result.added, result.skipped));
    } catch (err) {
      alert('שגיאה בייבוא הקובץ');
    }
  };
  reader.onerror = () => alert('שגיאה בקריאת הקובץ');
  reader.readAsText(file, 'UTF-8');
}

function openSheetsModal() {
  document.getElementById('sheetsModal').classList.add('active');
}

async function syncSheets() {
  const url = document.getElementById('sheetsUrl').value.trim();
  const status = document.getElementById('syncStatus');
  if (!url) {
    status.textContent = 'הכנס קישור';
    return;
  }
  status.style.color = '';
  status.textContent = 'מסנכרן...';
  try {
    let csvUrl = url;
    const m = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
    if (m) csvUrl = 'https://docs.google.com/spreadsheets/d/' + m[1] + '/export?format=csv';
    const res = await fetch(csvUrl);
    if (!res.ok) throw new Error('לא ניתן לקרוא את הגיליון (' + res.status + ')');
    const text = await res.text();
    if (/<!doctype html/i.test(text) || /^\s*</.test(text)) {
      throw new Error('הגיליון לא נגיש. יש לפרסם אותו לצפייה.');
    }
    const rows = parseCSV(text);
    const result = importLeadRows(rows, { source: 'sheets' });
    renderLeads();
    status.style.color = 'green';
    status.textContent = describeImport(result.added, result.skipped);
    setTimeout(() => document.getElementById('sheetsModal').classList.remove('active'), 1400);
  } catch (err) {
    status.style.color = 'red';
    status.textContent = err && err.message ? String(err.message) : 'הסנכרון נכשל';
  }
}

function renderUsers() {
  const body = document.getElementById('usersList');
  if (!body) return;
  body.innerHTML = Object.entries(users).map(([key, u]) => {
    if (!u || typeof u !== 'object') return '';
    const adminUser = key === ADMIN_USERNAME || u.role === 'admin';
    const actions = adminUser
      ? `<button type="button" class="btn" style="padding:0.3rem 0.5rem;font-size:0.8rem;" data-action="edit" data-user="${escapeHtml(key)}">שינוי סיסמה</button>`
      : `<button type="button" class="btn" style="padding:0.3rem 0.5rem;font-size:0.8rem;" data-action="edit" data-user="${escapeHtml(key)}">עריכה</button>
         <button type="button" class="btn" style="padding:0.3rem 0.5rem;font-size:0.8rem;background:#dc2626;" data-action="delete" data-user="${escapeHtml(key)}">מחיקה</button>`;
    return `<tr>
      <td>${escapeHtml(key)}</td>
      <td>${escapeHtml(u.name || '')}</td>
      <td>${escapeHtml(u.rabbanit || '-')}</td>
      <td>${roleLabel(u.role)}</td>
      <td>${actions}</td>
    </tr>`;
  }).join('');
  fillWaFilter();
}

function onUserAction(e) {
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const key = btn.getAttribute('data-user');
  if (btn.getAttribute('data-action') === 'edit') editUser(key);
  else if (btn.getAttribute('data-action') === 'delete') deleteUser(key);
}

function editUser(key) {
  const u = users[key];
  if (!u) return;
  document.getElementById('userModal').classList.add('active');
  const adminUser = key === ADMIN_USERNAME || u.role === 'admin';
  document.querySelector('#userModal h3').textContent = adminUser ? 'שינוי סיסמת מנהל' : 'עריכת משתמש';
  document.getElementById('newUsername').value = key;
  document.getElementById('newUsername').disabled = true;
  document.getElementById('newPassword').value = '';
  document.getElementById('newPassword').placeholder = 'השאר ריק כדי לא לשנות';
  document.getElementById('newDisplayName').value = u.name || '';
  document.getElementById('newRabbanit').value = u.rabbanit || '';
  const rabGroup = document.getElementById('newRabbanitGroup');
  if (rabGroup) rabGroup.style.display = adminUser ? 'none' : '';
  document.getElementById('userModal').dataset.editKey = key;
}

function openAddUser() {
  document.getElementById('userModal').classList.add('active');
  document.querySelector('#userModal h3').textContent = 'הוספת משתמש';
  document.getElementById('newUsername').disabled = false;
  document.getElementById('newPassword').placeholder = 'סיסמה';
  const rabGroup = document.getElementById('newRabbanitGroup');
  if (rabGroup) rabGroup.style.display = '';
  document.querySelector('#userModal form').reset();
  delete document.getElementById('userModal').dataset.editKey;
}

function closeUserModal() {
  document.getElementById('userModal').classList.remove('active');
  document.getElementById('newUsername').disabled = false;
  const rabGroup = document.getElementById('newRabbanitGroup');
  if (rabGroup) rabGroup.style.display = '';
}

async function saveNewUser(e) {
  e.preventDefault();
  const editKey = document.getElementById('userModal').dataset.editKey;
  const username = editKey || document.getElementById('newUsername').value.trim();
  const password = document.getElementById('newPassword').value;
  const displayName = document.getElementById('newDisplayName').value.trim();
  const rabbanit = document.getElementById('newRabbanit').value.trim();
  if (!username || !displayName || (!editKey && !password)) {
    alert('מלא את השדות החובה');
    return;
  }
  if (!editKey && (isProtectedUsername(username) || users[username])) {
    alert('לא ניתן ליצור משתמש בשם זה');
    return;
  }
  try {
    if (editKey) {
      const existing = users[editKey];
      if (!existing) {
        alert('המשתמש לא נמצא');
        return;
      }
      const adminUser = editKey === ADMIN_USERNAME || existing.role === 'admin';
      users[editKey] = {
        passHash: password ? await sha256(password) : existing.passHash,
        name: displayName,
        role: adminUser ? 'admin' : existing.role,
        rabbanit: adminUser ? (existing.rabbanit || '') : rabbanit
      };
    } else {
      users[username] = {
        passHash: await sha256(password),
        name: displayName,
        role: rabbanit ? 'rabbanit' : 'operator',
        rabbanit
      };
    }
    if (!saveUsers()) return;
    closeUserModal();
    renderUsers();
    document.querySelector('#userModal form').reset();
  } catch (err) {
    alert('שמירת המשתמש נכשלה');
  }
}

function deleteUser(key) {
  if (key === ADMIN_USERNAME || (users[key] && users[key].role === 'admin')) {
    alert('לא ניתן למחוק את חשבון המנהל');
    return;
  }
  if (!confirm('למחוק?')) return;
  delete users[key];
  saveUsers();
  renderUsers();
}

document.getElementById('leadsBody').addEventListener('click', onLeadAction);
document.getElementById('usersList').addEventListener('click', onUserAction);

async function boot() {
  try {
    loadTemplate();
    const loadedLeads = loadJSON('zohar_leads', []);
    leads = Array.isArray(loadedLeads) ? loadedLeads : [];
    normalizeLeadIds();
    await ensureUsers();
  } catch (err) {
    if (!Array.isArray(leads)) leads = [];
    if (!users || typeof users !== 'object') users = {};
  }
}

const appReady = boot();
</script>
</body>
